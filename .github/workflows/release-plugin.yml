name: Release plugin

on:
  push:
    tags:
      - "dyspatch-plugin-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin.json version
        id: version
        run: |
          version=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
            dyspatch-claude-plugin/.claude-plugin/plugin.json | head -n 1)
          tag_version=${GITHUB_REF_NAME#dyspatch-plugin-v}
          if [ "$version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: sh scripts/build-plugin.sh "dyspatch-${{ steps.version.outputs.version }}.plugin"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dyspatch-${{ steps.version.outputs.version }}.plugin" \
            --title "Dyspatch Claude plugin ${{ steps.version.outputs.version }}" \
            --generate-notes
