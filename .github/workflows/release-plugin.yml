name: Release plugin

on:
  push:
    tags:
      - "dyspatch-plugin-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. dyspatch-plugin-v0.2.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check tag name
        run: |
          case "$TAG" in
            dyspatch-plugin-v*) ;;
            *) echo "::error::$TAG is not a dyspatch-plugin-v* tag"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check tag matches plugin.json version
        id: version
        run: |
          version=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
            dyspatch-claude-plugin/.claude-plugin/plugin.json | head -n 1)
          tag_version=${TAG#dyspatch-plugin-v}
          if [ "$version" != "$tag_version" ]; then
            echo "::error::Tag $TAG does not match plugin.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Two copies of the package: a versioned one, and dyspatch.plugin so that
      # releases/latest/download/dyspatch.plugin always serves the newest release.
      - name: Build package
        run: |
          sh scripts/build-plugin.sh "dyspatch-${{ steps.version.outputs.version }}.plugin"
          cp "dyspatch-${{ steps.version.outputs.version }}.plugin" dyspatch.plugin

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "dyspatch-${{ steps.version.outputs.version }}.plugin" \
            dyspatch.plugin \
            --verify-tag \
            --title "Dyspatch Claude plugin ${{ steps.version.outputs.version }}" \
            --generate-notes
